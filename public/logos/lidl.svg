<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Lidl blue square base with red border -->
  <rect width="100" height="100" rx="8" fill="#0050AA"/>
  <!-- Lidl yellow circle with thin red border -->
  <circle cx="50" cy="50" r="41" fill="#FFF000" stroke="#E60A14" stroke-width="3"/>
  <!-- LIDL wordmark inside -->
  <text x="21" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#0050AA">L</text>
  <!-- Tilted red i -->
  <g transform="rotate(-15 48 50)">
    <circle cx="48" cy="36" r="3.5" fill="#E60A14"/>
    <rect x="45" y="42" width="6" height="15" fill="#E60A14"/>
  </g>
  <text x="56" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#0050AA">D</text>
  <text x="76" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#0050AA">L</text>
</svg>
