<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#FFFFFF" stroke="#005DA4" stroke-width="2"/>
  <!-- Blue and Orange circular arcs / rings of E.Leclerc -->
  <circle cx="50" cy="38" r="24" fill="none" stroke="#005DA4" stroke-width="5"/>
  <circle cx="58" cy="38" r="18" fill="none" stroke="#F18700" stroke-width="4"/>
  <!-- E.Leclerc wordmark -->
  <text x="50" y="45" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="20" fill="#005DA4">E</text>
  <text x="50" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#005DA4" letter-spacing="0.5">Leclerc</text>
</svg>
