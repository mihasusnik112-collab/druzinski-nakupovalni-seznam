<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Eurospin classic blue rounded rectangle -->
  <rect width="100" height="100" rx="16" fill="#003B7B"/>
  <!-- Yellow and blue interlocking oval / circle star motif -->
  <circle cx="50" cy="38" r="20" fill="none" stroke="#FED100" stroke-width="4.5"/>
  <circle cx="50" cy="38" r="13" fill="#FED100"/>
  <!-- EUROSPIN text -->
  <text x="50" y="78" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="0.5">EUROSPIN</text>
</svg>
